name: Knowledge Check

# Integrity gate for the two-tier rules system (.claude/rules core + on-demand
# .claude/knowledge/, routed by RULES_INDEX + the doc-loader/skill-loader tables).
# Runs the zero-dep doctor `devtools/knowledge-check.mjs` so a broken index,
# an un-indexed knowledge rule, a stale `.claude/rules/<moved>` ref, core-set
# re-inflation, or a dead router reference can't merge. Path-filtered so it only
# fires when the rules system actually changes. See .claude/rules/RULES_INDEX.md.

on:
  push:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'devtools/knowledge-check.mjs'
      - '.github/workflows/knowledge-check.yml'
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'devtools/knowledge-check.mjs'
      - '.github/workflows/knowledge-check.yml'

concurrency:
  group: knowledge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-check:
    name: Rules-system integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # knowledge-check.mjs uses `git ls-files`; a normal checkout provides it.

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Zero-dependency script — no `npm ci` needed. Non-zero exit on any FAIL.
      - name: Rules-system integrity (index / links / core-drift / routers)
        run: node devtools/knowledge-check.mjs

      - name: Context-footprint budget (always-loaded base <= 64KB)
        run: node devtools/context-footprint.mjs
