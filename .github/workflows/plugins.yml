# Builds the OFFICIAL plugin packs (plugins/D3dxSkinManager.Plugins.slnx) separately from the app
# bundle and attaches them as release assets. The in-app plugin manager downloads packs from the
# LATEST release (PluginInstallService — asset names are part of that contract).
#
# Runs when a release is published (attaches to it) or manually (workflow_dispatch with a tag).
name: Build Plugin Packs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the plugin packs to (e.g. v3.5)'
        required: true

jobs:
  content-veil-ai:
    runs-on: windows-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ONNX model is NOT in git (11.5MB, pinned) — fetched at build time and verified.
      - name: Download detector model (pinned sha256)
        shell: pwsh
        run: |
          $dest = "plugins/D3dxSkinManager.Plugins.ContentVeil/Models/censor-detect.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/deepghs/anime_censor_detection/resolve/main/censor_detect_v1.0_n/model.onnx" -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          $expected = "029de0a116f6c3c73bde62d2a8354c78664795579858f3c8e28fc1b4633a891c"
          if ($hash -ne $expected) { Write-Host "::error::model sha256 mismatch: $hash"; exit 1 }

      - name: Build plugin
        run: dotnet build plugins/D3dxSkinManager.Plugins.ContentVeil/D3dxSkinManager.Plugins.ContentVeil.csproj -c Release --nologo

      - name: Package pack zip
        shell: pwsh
        run: |
          # SINGLE-DLL pack: the model + managed ONNX wrapper + native dlls are all embedded in
          # the plugin dll (see PluginBootstrap). The zip holds just the one file.
          $dll = "plugins/D3dxSkinManager.Plugins.ContentVeil/bin/Release/net10.0-windows/D3dxSkinManager.Plugins.ContentVeil.dll"
          Compress-Archive -Path $dll -DestinationPath "ContentVeil-AI-Plugin.zip" -Force
          Write-Host "dll size: $([math]::Round((Get-Item $dll).Length / 1MB, 1)) MB"
          Write-Host "pack size: $([math]::Round((Get-Item ContentVeil-AI-Plugin.zip).Length / 1MB, 1)) MB"

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ inputs.tag }}" }
          gh release upload $tag ContentVeil-AI-Plugin.zip --clobber
