name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2) - leave empty to use current version'
        required: false
        type: string
      bump:
        description: 'Version bump type (default minor; an explicit version input overrides this)'
        required: false
        type: choice
        default: 'minor'
        options:
          - none
          - minor
          - major
      create_tag:
        description: 'Create git tag'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create as draft (recommended for review before publishing)'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release (beta/alpha)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Required for creating releases and tags

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: windows-latest

    steps:
      # ========================================
      # Step 1: Checkout code
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog

      # ========================================
      # Step 2: Setup .NET
      # ========================================
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ========================================
      # Step 3: Setup Node.js for frontend build
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: D3dxSkinManager.Client/package-lock.json

      # ========================================
      # Step 4: Setup MSBuild (for C++ launcher)
      # ========================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ========================================
      # Step 5: Determine version
      # ========================================
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # Read current version from .csproj
          [xml]$csproj = Get-Content "D3dxSkinManager\D3dxSkinManager.csproj"
          $currentVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ -ne $null } | Select-Object -First 1

          Write-Host "Current version: $currentVersion"

          # Determine final version. An explicit `version` input WINS; otherwise the `bump` type
          # applies (default minor). bump=none + no version = keep the current version.
          $finalVersion = $currentVersion

          if ("${{ inputs.version }}" -ne "") {
            # Manual version override (takes precedence over bump)
            $finalVersion = "${{ inputs.version }}"
            Write-Host "Manual version: $finalVersion"
          } elseif ("${{ inputs.bump }}" -ne "none") {
            # Bump version (using MAJOR.MINOR format)
            if ($currentVersion -match '^(\d+)\.(\d+)$') {
              $major = [int]$matches[1]
              $minor = [int]$matches[2]

              switch ("${{ inputs.bump }}") {
                "major" {
                  $major++
                  $minor = 0
                }
                "minor" {
                  $minor++
                }
              }

              $finalVersion = "$major.$minor"
              Write-Host "Bumped ${{ inputs.bump }}: $currentVersion → $finalVersion"
            } else {
              Write-Host "::error::Invalid version format: $currentVersion (expected: X.Y)"
              exit 1
            }
          }

          # Update .csproj if version changed
          if ($finalVersion -ne $currentVersion) {
            Write-Host "Updating .csproj to version $finalVersion"

            $propertyGroup = $csproj.Project.PropertyGroup | Where-Object { $_.Version -ne $null } | Select-Object -First 1
            $propertyGroup.Version = $finalVersion
            $propertyGroup.AssemblyVersion = "$finalVersion.0"
            $propertyGroup.FileVersion = "$finalVersion.0"
            $propertyGroup.InformationalVersion = $finalVersion

            $csproj.Save("$PWD\D3dxSkinManager\D3dxSkinManager.csproj")

            # Commit version change
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add D3dxSkinManager/D3dxSkinManager.csproj
            git commit -m "chore: bump version to $finalVersion"
            git push
          }

          # Set outputs
          "version=$finalVersion" >> $env:GITHUB_OUTPUT
          "tag=v$finalVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Final version: $finalVersion"
          Write-Host "Tag: v$finalVersion"

      # ========================================
      # Step 6: Build frontend
      # ========================================
      - name: Build React frontend
        working-directory: D3dxSkinManager.Client
        run: |
          npm ci
          npm run build

      # ========================================
      # Step 7: Copy frontend to backend
      # ========================================
      - name: Copy frontend to wwwroot
        shell: pwsh
        run: |
          $wwwrootPath = "D3dxSkinManager\wwwroot"
          if (Test-Path $wwwrootPath) {
            Remove-Item -Recurse -Force $wwwrootPath
          }
          New-Item -ItemType Directory -Path $wwwrootPath -Force | Out-Null
          Copy-Item -Path "D3dxSkinManager.Client\build\*" -Destination $wwwrootPath -Recurse -Force

      # ========================================
      # Step 8: Build .NET application (x64)
      # ========================================
      - name: Publish .NET application (win-x64)
        working-directory: D3dxSkinManager
        run: |
          dotnet publish -c Release -r win-x64 --no-self-contained /p:PublishReadyToRun=true /p:PublishTrimmed=false

      # ========================================
      # Step 9: Build C++ Launcher (x64)
      # ========================================
      - name: Build C++ Launcher (x64)
        working-directory: D3dxSkinManager.Launcher
        env:
          CI: true  # Use v143 toolset for GitHub Actions compatibility
        run: |
          msbuild Launcher.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Rebuild /m /v:minimal /nologo

      # ========================================
      # Step 10: Package release (x64)
      # ========================================
      - name: Package release artifacts
        shell: pwsh
        run: |
          $publishDir = "D3dxSkinManager\bin\Release\net10.0-windows\win-x64\publish"
          $releaseDir = "release\win-x64"

          # Create release directory
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          # Copy C++ launcher — now the top-level D3dxSkinManager.exe the user runs (the runtime moves
          # into lib\). Its build output name is D3dxSkinManager.exe (Launcher.vcxproj TargetName).
          Copy-Item "D3dxSkinManager.Launcher\bin\x64\Release\D3dxSkinManager.exe" "$releaseDir\D3dxSkinManager.exe"

          # Copy the .NET runtime into lib\ renamed. The launcher passes --app-root (its own dir) so the
          # app resolves data\/res\/libs\/.update\ against the install root, not lib\.
          New-Item -ItemType Directory -Path "$releaseDir\lib" -Force | Out-Null
          Copy-Item "$publishDir\D3dxSkinManager.exe" "$releaseDir\lib\D3dxSkinManager.App.exe"

          # Copy shipped resources (res\languages + res\remote-sources seeds). The publish output
          # emits these under res\ (csproj Content TargetPath), NOT data\ — the old data\languages
          # check silently skipped them, shipping a res-less zip + a 2-file manifest (fixed 2026-07-06).
          if (Test-Path "$publishDir\res") {
            Copy-Item "$publishDir\res" "$releaseDir\" -Recurse -Force
          } else {
            Write-Host "::error::res\ folder missing from publish output — languages + remote-source seeds would be lost"
            exit 1
          }

          # Copy native libraries
          if (Test-Path "$publishDir\libs") {
            Copy-Item "$publishDir\libs" "$releaseDir\" -Recurse -Force
          }

          # Generate the auto-update manifest (lists every updatable file + sha256; excludes the
          # launcher, which never auto-updates). Written INTO the payload so the installed copy has a
          # local baseline to diff against, and copied out as a standalone asset the launcher can fetch
          # without downloading the whole zip. See docs/LAUNCHER_ARCHITECTURE.md.
          node devtools\scripts\build-manifest.mjs "$releaseDir" "${{ steps.version.outputs.version }}" "$releaseDir\manifest.json"
          Copy-Item "$releaseDir\manifest.json" "release\manifest.json" -Force

          # Create zip (now includes manifest.json as the installed baseline)
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "release\D3dxSkinManager-v${{ steps.version.outputs.version }}-win-x64.zip" -Force

      # ========================================
      # Step 10b: Build/carry OFFICIAL plugin packs (manifest-driven)
      # ========================================
      # Reads plugins/plugins.manifest.json. For each pack: if its `version` matches the previous
      # published release's manifest, CARRY the already-built zip forward (re-download it — skip the
      # dotnet build + model fetch); otherwise BUILD fresh (fetch the model, verify the pinned sha256,
      # build Release, zip the single dll). Every release still carries the pack zip (the in-app
      # download resolves the fixed asset name off /releases/latest) PLUS a public plugins-manifest.json
      # (so the app can show the available version). Plugin versions are independent of the app version.
      - name: Build plugin packs (manifest-driven)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content Plugins/plugins.manifest.json -Raw | ConvertFrom-Json
          $releaseDir = "release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          # Previous published release's manifest → per-plugin version + tag (to detect unchanged
          # packs). Best-effort: any failure (no prior release / no manifest asset) builds everything.
          $prev = @{}
          try {
            $prevJson = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            $prevAsset = $prevJson.assets | Where-Object { $_.name -eq "plugins-manifest.json" } | Select-Object -First 1
            if ($prevAsset) {
              $tmp = New-TemporaryFile
              Invoke-WebRequest -Uri $prevAsset.browser_download_url -OutFile $tmp
              $prevManifest = Get-Content $tmp -Raw | ConvertFrom-Json
              foreach ($p in $prevManifest.plugins) { $prev[$p.id] = @{ version = "$($p.version)"; tag = $prevJson.tag_name } }
              Write-Host "Previous plugin manifest from $($prevJson.tag_name): $($prev.Keys -join ', ')"
            }
          } catch { Write-Host "No previous plugin manifest — building all packs" }

          $public = @()
          foreach ($p in $manifest.plugins) {
            $prevEntry = $prev[$p.id]
            $unchanged = $prevEntry -and ($prevEntry.version -eq "$($p.version)")

            if ($unchanged) {
              Write-Host "Plugin $($p.id) v$($p.version) unchanged — carrying built asset from $($prevEntry.tag)"
              gh release download $prevEntry.tag -R "${{ github.repository }}" -p $p.asset -D $releaseDir --clobber
              if (-not (Test-Path "$releaseDir/$($p.asset)")) {
                Write-Host "::warning::carry-forward failed for $($p.id) — building fresh"
                $unchanged = $false
              }
            }

            if (-not $unchanged) {
              Write-Host "Building plugin $($p.id) v$($p.version)"
              New-Item -ItemType Directory -Force (Split-Path $p.model.dest) | Out-Null
              Invoke-WebRequest -Uri $p.model.url -OutFile $p.model.dest
              $hash = (Get-FileHash $p.model.dest -Algorithm SHA256).Hash.ToLower()
              if ($hash -ne $p.model.sha256) { Write-Host "::error::model sha256 mismatch for $($p.id): $hash"; exit 1 }
              dotnet build $p.project -c Release --nologo
              Compress-Archive -Path $p.dll -DestinationPath "$releaseDir/$($p.asset)" -Force
            }

            Write-Host "pack $($p.asset): $([math]::Round((Get-Item "$releaseDir/$($p.asset)").Length / 1MB, 1)) MB"
            $public += [ordered]@{ id = $p.id; name = $p.name; description = $p.description; version = "$($p.version)"; asset = $p.asset }
          }

          # The public manifest attached to THIS release (id/name/description/version/asset only).
          @{ plugins = $public } | ConvertTo-Json -Depth 5 | Out-File "$releaseDir/plugins-manifest.json" -Encoding utf8
          Write-Host "Wrote plugins-manifest.json with $($public.Count) pack(s)"

      # ========================================
      # Step 11: Generate release notes from git log
      # ========================================
      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $currentTag = "${{ steps.version.outputs.tag }}"

          # Find previous tag
          $allTags = git tag --sort=-version:refname | Where-Object { $_ -match '^v\d' }
          $previousTag = $null
          foreach ($t in $allTags) {
            if ($t -ne $currentTag) {
              $previousTag = $t
              break
            }
          }

          # Get commits between previous tag and HEAD (or all commits if no previous tag)
          if ($previousTag) {
            Write-Host "Generating notes: $previousTag..$currentTag"
            $commits = git log "$previousTag..HEAD" --pretty=format:"%s" --no-merges
          } else {
            Write-Host "No previous tag found — using all commits"
            $commits = git log --pretty=format:"%s" --no-merges
          }

          # Categorize commits by conventional commit prefix
          $features = @()
          $fixes = @()
          $other = @()

          foreach ($msg in $commits) {
            if ($msg -match '^feat:\s*(.+)') {
              $features += $matches[1].Trim()
            } elseif ($msg -match '^fix:\s*(.+)') {
              $fixes += $matches[1].Trim()
            } elseif ($msg -match '^(chore|docs|refactor|style|perf|test|ci):\s*') {
              # Skip non-user-facing commits
            } else {
              $other += $msg
            }
          }

          # Build release notes markdown
          $notes = @()

          if ($features.Count -gt 0) {
            $notes += "### New Features"
            $notes += ""
            foreach ($f in $features) { $notes += "- $f" }
            $notes += ""
          }

          if ($fixes.Count -gt 0) {
            $notes += "### Bug Fixes"
            $notes += ""
            foreach ($f in $fixes) { $notes += "- $f" }
            $notes += ""
          }

          if ($other.Count -gt 0) {
            $notes += "### Other Changes"
            $notes += ""
            foreach ($f in $other) { $notes += "- $f" }
            $notes += ""
          }

          if ($notes.Count -eq 0) {
            $notes += "No notable changes in this release."
          }

          # Add install instructions
          $notes += "---"
          $notes += ""
          $notes += "### Installation"
          $notes += ""
          $notes += "1. Download ``D3dxSkinManager-$currentTag-win-x64.zip``"
          $notes += "2. Extract to a folder"
          $notes += "3. Run ``D3dxSkinManager.exe``"
          $notes += "4. The launcher will automatically install .NET 10 runtime if needed"
          $notes += ""
          $notes += "**Requirements**: Windows 10/11 (x64)"

          $releaseNotes = $notes -join "`n"
          $releaseNotes | Out-File -FilePath "release-notes.md" -Encoding UTF8

          Write-Host "Release notes generated:"
          Write-Host $releaseNotes

      # ========================================
      # Step 12: Create git tag (if requested)
      # ========================================
      - name: Create git tag
        if: inputs.create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # ========================================
      # Step 13: Create GitHub Release
      # ========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: D3dxSkinManager ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            release/*.zip
            release/manifest.json
            release/plugins-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # Step 14: Summary
      # ========================================
      - name: Summary
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Release Created Successfully!" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Version: ${{ steps.version.outputs.version }}" -ForegroundColor Yellow
          Write-Host "Tag: ${{ steps.version.outputs.tag }}" -ForegroundColor Yellow
          Write-Host "Status: ${{ inputs.draft == true && 'Draft (review and publish manually)' || 'Published' }}" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "View release at:" -ForegroundColor Cyan
          Write-Host "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" -ForegroundColor White
          Write-Host ""
          if ("${{ inputs.draft }}" -eq "true") {
            Write-Host "DRAFT RELEASE - Review and click 'Publish release' when ready!" -ForegroundColor Yellow
          }
